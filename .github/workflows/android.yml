# ═════════════════════════════════════════════════════════════
#  Alice-App · CI
#  • дешёвые чеки: sh -n по бэкенду, node --check по интерфейсу
#  • сборка release APK с подписью (keystore из GitHub Secrets)
#  • проверка подписи apksigner, выкладка артефакта
#  • на теге v* — релиз с APK
#
#  Секреты:
#    ALICE_KEYSTORE_B64   base64 keystore/alice.jks
#    ALICE_KS_PASSWORD    пароль keystore
#    ALICE_KS_ALIAS       alice
#    ALICE_KS_KEY_PASSWORD пароль ключа (если ≠ паролю keystore)
#  Без секретов собираем НЕПОДПИСАННЫЙ APK — сборка всё равно зелёная.
# ═════════════════════════════════════════════════════════════

name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно для публикации релиза по тегу

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_KEYSTORE: ${{ secrets.ALICE_KEYSTORE_B64 != '' && 'true' || 'false' }}
      ALICE_KEYSTORE_B64: ${{ secrets.ALICE_KEYSTORE_B64 }}
      ALICE_KS_PASSWORD: ${{ secrets.ALICE_KS_PASSWORD }}
      ALICE_KS_ALIAS: ${{ secrets.ALICE_KS_ALIAS }}
      ALICE_KS_KEY_PASSWORD: ${{ secrets.ALICE_KS_KEY_PASSWORD }}

    steps:
      - name: Код
        uses: actions/checkout@v4

      # ─── дешёвые чеки: падаем до сборки, если что-то синтаксически сломано ───
      - name: Проверка бэкенда (sh -n)
        run: |
          for f in speaker/*.sh; do
            sh -n "$f" && echo "ok  $f"
          done

      - name: Проверка интерфейса (node --check)
        run: |
          cp web/app.js /tmp/app.mjs
          node --check /tmp/app.mjs && echo "ok  web/app.js"

      # ─── окружение сборки ───
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # пакет 'tools' удалён из репозитория SDK и валит sdkmanager;
          # ставим только лицензии — платформа/build-tools Gradle докачает сам
          packages: ''

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore из секретов
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p keystore
          printf '%s' "$ALICE_KEYSTORE_B64" | base64 -d > keystore/alice.jks
          test -s keystore/alice.jks && echo "keystore восстановлен ($(wc -c < keystore/alice.jks) байт)"

      # ─── сборка ───
      - name: Сборка release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Переименовать APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Alice-App-${GITHUB_REF_NAME#v}.apk"
          ls -la Alice-App-*.apk

      - name: Проверка подписи
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "Alice-App-${GITHUB_REF_NAME#v}.apk"
          "$APKSIGNER" print-certs "Alice-App-${GITHUB_REF_NAME#v}.apk" | head -5

      - name: APK — артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Alice-App-${{ github.ref_name }}
          path: Alice-App-*.apk
          if-no-files-found: error

      # ─── релиз: git tag v1.1 && git push origin v1.1 ───
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Alice-App-*.apk
          generate_release_notes: true
