## ════════════════════════════════════════════════════════
##  Alice-App · lighttpd на колонке (порт 8080)
##  /            — интерфейс (Material Web)
##  /cgi-bin/api.sh — приёмник/отдатчик команд
## ════════════════════════════════════════════════════════

server.document-root = "/data/opt/www"
server.port = 8080
server.bind = "0.0.0.0"
server.pid-file = "/var/run/alice-httpd.pid"
server.errorlog  = "/data/opt/alice/logs/lighttpd.err"
server.upload-dirs = ( "/tmp" )
index-file.names = ( "index.html" )

server.modules = (
    "mod_cgi",
    "mod_alias",
    "mod_accesslog",
    "mod_staticfile",
    "mod_setenv"
)

cgi.assign = ( ".sh" => "" )
alias.url  = ( "/cgi-bin/" => "/data/opt/alice/cgi-bin/" )

accesslog.filename = "/data/opt/alice/logs/access.log"
setenv.add-response-header = ( "Cache-Control" => "no-store" )
